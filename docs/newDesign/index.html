<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Islamic Library — Books + Hikma AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<style>
/* ============================================
   Islamic Library — Digital Library
   Three aesthetic variants via data-aesthetic
   ============================================ */

@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=Geist:wght@400;500;600;700&family=IBM+Plex+Serif:wght@400;500;600;700&family=Amiri:wght@400;700&family=Reem+Kufi:wght@400;500;600;700&display=swap');

/* ============================================
   BASE TOKENS
   ============================================ */
:root {
  --header-h: 72px;
  --gap: 20px;

  --radius-sm: 8px;
  --radius-md: 14px;
  --radius-lg: 20px;
  --radius-xl: 28px;
  --radius-pill: 999px;

  --shadow-soft: 0 1px 2px rgba(0,0,0,0.04), 0 4px 16px rgba(0,0,0,0.04);
  --shadow-card: 0 1px 2px rgba(0,0,0,0.06), 0 12px 32px rgba(0,0,0,0.08);
  --shadow-lift: 0 20px 60px rgba(0,0,0,0.12);

  --font-display: 'Fraunces', 'IBM Plex Serif', Georgia, serif;
  --font-body: 'Geist', 'Inter', system-ui, sans-serif;
  --font-arabic: 'Amiri', 'Reem Kufi', serif;
}

/* ============================================
   AESTHETIC 1 — EDITORIAL (default)
   Cream paper · navy ink · single emerald accent
   ============================================ */
body[data-aesthetic="editorial"] {
  --bg: #F7F5F0;
  --bg-elev: #FFFFFF;
  --surface: #FFFFFF;
  --surface-2: #FAF8F3;
  --surface-3: #EFEBE2;
  --border: rgba(20, 25, 30, 0.08);
  --border-strong: rgba(20, 25, 30, 0.16);
  --text: #14191E;
  --text-muted: #5A6168;
  --text-faint: #8A8F95;
  --accent: #6B76E8;
  --accent-fg: #FFFFFF;
  --accent-soft: #E6E8FB;
  --chat-bg: #FFFFFF;
  --chat-user: #14191E;
  --chat-user-fg: #F7F5F0;
  --chat-ai: #FAF8F3;
  --chat-ai-fg: #14191E;
  --pattern-color: rgba(107, 118, 232, 0.05);
  --book-mark-fg: #14191E;
  --cover-grain: 0.02;
}

/* ============================================
   AESTHETIC 2 — WARM BOOKISH
   Paper · dark forest · ochre · serif headings
   ============================================ */
body[data-aesthetic="bookish"] {
  --bg: #F0E9DC;
  --bg-elev: #F7F1E4;
  --surface: #FBF5E8;
  --surface-2: #F0E9DC;
  --surface-3: #E5DCC8;
  --border: rgba(60, 45, 25, 0.14);
  --border-strong: rgba(60, 45, 25, 0.26);
  --text: #1B3A2E;
  --text-muted: #5F5040;
  --text-faint: #8A7860;
  --accent: #C9882F;
  --accent-fg: #FBF5E8;
  --accent-soft: #F2E1BE;
  --chat-bg: #FBF5E8;
  --chat-user: #1B3A2E;
  --chat-user-fg: #FBF5E8;
  --chat-ai: #F0E6D0;
  --chat-ai-fg: #1B3A2E;
  --pattern-color: rgba(27, 58, 46, 0.06);
  --book-mark-fg: #FBF5E8;
  --cover-grain: 0.06;
}

/* ============================================
   AESTHETIC 3 — DARK PREMIUM
   Deep teal-black · gold · emerald · geometric
   ============================================ */
body[data-aesthetic="dark"] {
  --bg: #0A0F0E;
  --bg-elev: #11181A;
  --surface: #141C1F;
  --surface-2: #1A2326;
  --surface-3: #232E32;
  --border: rgba(212, 165, 92, 0.12);
  --border-strong: rgba(212, 165, 92, 0.28);
  --text: #ECE6D8;
  --text-muted: #9DA39C;
  --text-faint: #6B716A;
  --accent: #D4A55C;
  --accent-fg: #0A0F0E;
  --accent-soft: rgba(212, 165, 92, 0.14);
  --chat-bg: #11181A;
  --chat-user: #D4A55C;
  --chat-user-fg: #0A0F0E;
  --chat-ai: #1A2326;
  --chat-ai-fg: #ECE6D8;
  --pattern-color: rgba(212, 165, 92, 0.06);
  --book-mark-fg: #ECE6D8;
  --cover-grain: 0.04;
}

/* ============================================
   BASE
   ============================================ */
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }

body {
  font-family: var(--font-body);
  background: var(--bg);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  font-feature-settings: "ss01", "cv11";
  min-height: 100vh;
  letter-spacing: -0.01em;
  transition: background 0.4s ease, color 0.4s ease;
  position: relative;
}

/* Subtle geometric overlay for dark mode */
body[data-aesthetic="dark"]::before {
  content: "";
  position: fixed;
  inset: 0;
  background-image:
    radial-gradient(circle at 25% 20%, var(--pattern-color) 0, transparent 50%),
    radial-gradient(circle at 75% 80%, var(--pattern-color) 0, transparent 50%);
  pointer-events: none;
  z-index: 0;
}

button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
input, textarea, select { font-family: inherit; color: inherit; }
a { color: inherit; text-decoration: none; }

/* ============================================
   HEADER
   ============================================ */
.header {
  position: sticky;
  top: 0;
  z-index: 50;
  height: var(--header-h);
  background: color-mix(in oklab, var(--bg) 80%, transparent);
  backdrop-filter: saturate(180%) blur(20px);
  -webkit-backdrop-filter: saturate(180%) blur(20px);
  border-bottom: 1px solid var(--border);
}

.header-inner {
  height: 100%;
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: 24px;
  padding: 0 24px;
  max-width: 1680px;
  margin: 0 auto;
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
}

.brand-mark {
  width: 42px;
  height: 42px;
  display: grid;
  place-items: center;
  color: #8B95F0;
  flex-shrink: 0;
}
.brand-mark svg { width: 100%; height: 100%; display: block; }
body[data-aesthetic="dark"] .brand-mark {
  color: #A4ADF5;
}
body[data-aesthetic="bookish"] .brand-mark {
  color: #8B95F0;
}

.brand-name {
  font-family: var(--font-body);
  font-size: 17px;
  font-weight: 800;
  letter-spacing: 0.02em;
  line-height: 1;
  color: #6B76E8;
  text-transform: uppercase;
}
body[data-aesthetic="dark"] .brand-name {
  color: #A4ADF5;
}
.brand-name em {
  font-style: normal;
  display: block;
  margin-top: 3px;
}
.brand-sub {
  font-size: 11px;
  color: var(--text-muted);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  margin-top: 1px;
}

.search {
  display: flex;
  align-items: center;
  gap: 10px;
  height: 44px;
  padding: 0 18px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-pill);
  max-width: 560px;
  width: 100%;
  justify-self: center;
  transition: border-color 0.2s ease, background 0.2s ease;
}
.search:focus-within {
  border-color: var(--accent);
  background: var(--bg-elev);
}
.search input {
  flex: 1;
  background: transparent;
  border: none;
  outline: none;
  font-size: 14px;
  color: var(--text);
}
.search input::placeholder { color: var(--text-faint); }
.search-kbd {
  display: flex;
  gap: 4px;
  font-size: 11px;
  color: var(--text-faint);
  font-family: var(--font-body);
}
.search-kbd kbd {
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 5px;
  padding: 1px 6px;
  font-family: inherit;
  font-size: 10px;
}

.header-right {
  display: flex;
  align-items: center;
  gap: 10px;
}

.lang-switch {
  display: flex;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-pill);
  padding: 3px;
  gap: 2px;
}
.lang-switch button {
  height: 30px;
  padding: 0 12px;
  border-radius: var(--radius-pill);
  font-size: 12px;
  font-weight: 600;
  color: var(--text-muted);
  letter-spacing: 0.04em;
  transition: all 0.2s ease;
}
.lang-switch button.active {
  background: var(--text);
  color: var(--bg);
}
body[data-aesthetic="dark"] .lang-switch button.active {
  background: var(--accent);
  color: var(--accent-fg);
}
.lang-switch button[data-lang="ar"].active {
  font-family: var(--font-arabic);
  font-size: 14px;
}

.icon-btn {
  width: 38px;
  height: 38px;
  display: grid;
  place-items: center;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 11px;
  color: var(--text);
  transition: all 0.2s ease;
}
.icon-btn:hover { background: var(--surface-2); }

.avatar {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--accent), var(--text));
  display: grid;
  place-items: center;
  color: var(--accent-fg);
  font-weight: 700;
  font-size: 13px;
}

/* ============================================
   MAIN GRID LAYOUT
   ============================================ */
.layout {
  display: grid;
  grid-template-columns: 400px minmax(0, 1fr) 260px;
  gap: var(--gap);
  max-width: 1680px;
  margin: 0 auto;
  padding: var(--gap) 24px 80px;
  position: relative;
  z-index: 1;
}

.col-chat,
.col-filters {
  position: sticky;
  top: calc(var(--header-h) + var(--gap));
  height: calc(100vh - var(--header-h) - var(--gap) * 2);
}

/* ============================================
   CHAT PANEL
   ============================================ */
.chat {
  display: flex;
  flex-direction: column;
  height: 100%;
  background: var(--chat-bg);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  overflow: hidden;
  box-shadow: var(--shadow-soft);
}

.chat-header {
  padding: 18px 20px;
  display: flex;
  align-items: center;
  gap: 12px;
  border-bottom: 1px solid var(--border);
  background: var(--bg-elev);
}

.ai-avatar {
  width: 40px;
  height: 40px;
  border-radius: 12px;
  background: linear-gradient(135deg, var(--accent), color-mix(in oklab, var(--accent) 60%, var(--text)));
  display: grid;
  place-items: center;
  position: relative;
  color: var(--accent-fg);
}
.ai-avatar::after {
  content: "";
  position: absolute;
  bottom: -1px;
  right: -1px;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #22C55E;
  border: 2px solid var(--bg-elev);
}

.ai-name {
  font-family: var(--font-display);
  font-size: 17px;
  font-weight: 600;
  letter-spacing: -0.01em;
  line-height: 1.1;
}
.ai-status {
  font-size: 11px;
  color: var(--text-muted);
  margin-top: 2px;
  letter-spacing: 0.02em;
}

.chat-actions {
  margin-left: auto;
  display: flex;
  gap: 6px;
}
.chat-actions .icon-btn {
  width: 32px;
  height: 32px;
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 9px;
}

.chat-body {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  scroll-behavior: smooth;
}
.chat-body::-webkit-scrollbar { width: 6px; }
.chat-body::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 3px; }

/* Empty state — Greeting card */
.chat-greet {
  padding: 22px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  position: relative;
  overflow: hidden;
}
.chat-greet-arabic {
  font-family: var(--font-arabic);
  font-size: 22px;
  color: var(--accent);
  margin-bottom: 6px;
  line-height: 1.4;
  direction: rtl;
}
.chat-greet-title {
  font-family: var(--font-display);
  font-size: 19px;
  font-weight: 600;
  letter-spacing: -0.01em;
  margin-bottom: 6px;
}
.chat-greet-text {
  font-size: 13px;
  color: var(--text-muted);
  line-height: 1.55;
}

.quick-prompts {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}
.quick-prompt {
  text-align: left;
  padding: 12px 14px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  transition: all 0.2s ease;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.quick-prompt:hover {
  border-color: var(--accent);
  background: var(--bg-elev);
  transform: translateY(-1px);
}
.quick-prompt-icon {
  width: 28px;
  height: 28px;
  border-radius: 8px;
  background: var(--accent-soft);
  color: var(--accent);
  display: grid;
  place-items: center;
}
.quick-prompt-label {
  font-size: 12.5px;
  font-weight: 600;
  letter-spacing: -0.01em;
  line-height: 1.3;
}
.quick-prompt-sub {
  font-size: 10.5px;
  color: var(--text-faint);
  line-height: 1.3;
}

/* Messages */
.msg {
  display: flex;
  flex-direction: column;
  gap: 4px;
  max-width: 92%;
}
.msg.user {
  align-self: flex-end;
  align-items: flex-end;
}
.msg.ai { align-self: flex-start; }

.msg-bubble {
  padding: 12px 16px;
  border-radius: 18px;
  font-size: 13.5px;
  line-height: 1.55;
  white-space: pre-wrap;
}
.msg.user .msg-bubble {
  background: var(--chat-user);
  color: var(--chat-user-fg);
  border-bottom-right-radius: 6px;
}
.msg.ai .msg-bubble {
  background: var(--chat-ai);
  color: var(--chat-ai-fg);
  border-bottom-left-radius: 6px;
  border: 1px solid var(--border);
}

.msg-time {
  font-size: 10.5px;
  color: var(--text-faint);
  padding: 0 4px;
}

.msg .arabic {
  font-family: var(--font-arabic);
  font-size: 19px;
  line-height: 1.6;
  direction: rtl;
  display: block;
  margin: 8px 0 4px;
  color: var(--accent);
}

/* Book cards inside a chat message */
.cite-cards {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-top: 10px;
}
.cite-card {
  display: flex;
  gap: 12px;
  padding: 10px;
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  align-items: center;
  transition: all 0.2s ease;
}
.cite-card:hover {
  border-color: var(--border-strong);
  transform: translateY(-1px);
  box-shadow: var(--shadow-soft);
}
.cite-cover {
  width: 44px;
  height: 60px;
  flex-shrink: 0;
  border-radius: 6px;
  overflow: hidden;
  position: relative;
}
.cite-info {
  flex: 1;
  min-width: 0;
}
.cite-title {
  font-size: 12.5px;
  font-weight: 600;
  line-height: 1.25;
  letter-spacing: -0.01em;
  margin-bottom: 3px;
  overflow: hidden;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
}
.cite-author {
  font-size: 10.5px;
  color: var(--text-muted);
}
.cite-badge {
  font-size: 9.5px;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  padding: 2px 7px;
  border-radius: var(--radius-pill);
  background: var(--accent-soft);
  color: var(--accent);
  margin-top: 4px;
  display: inline-block;
}
.cite-open {
  font-size: 11px;
  font-weight: 600;
  padding: 6px 10px;
  background: var(--text);
  color: var(--bg);
  border-radius: var(--radius-pill);
  white-space: nowrap;
  letter-spacing: -0.005em;
}
body[data-aesthetic="dark"] .cite-open {
  background: var(--accent);
  color: var(--accent-fg);
}

/* Typing indicator */
.typing {
  display: flex;
  gap: 4px;
  padding: 14px 16px;
  background: var(--chat-ai);
  border: 1px solid var(--border);
  border-radius: 18px;
  border-bottom-left-radius: 6px;
  width: fit-content;
}
.typing span {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--text-muted);
  animation: typing 1.2s infinite ease-in-out;
}
.typing span:nth-child(2) { animation-delay: 0.2s; }
.typing span:nth-child(3) { animation-delay: 0.4s; }
@keyframes typing {
  0%, 60%, 100% { opacity: 0.3; transform: translateY(0); }
  30% { opacity: 1; transform: translateY(-3px); }
}

/* Chat input */
.chat-input-wrap {
  padding: 14px 16px 16px;
  border-top: 1px solid var(--border);
  background: var(--bg-elev);
}
.chat-input {
  display: flex;
  align-items: end;
  gap: 8px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 8px 8px 8px 14px;
  transition: border-color 0.2s ease;
}
.chat-input:focus-within { border-color: var(--accent); }
.chat-input textarea {
  flex: 1;
  background: transparent;
  border: none;
  outline: none;
  resize: none;
  font-size: 13.5px;
  line-height: 1.45;
  max-height: 100px;
  min-height: 22px;
  padding: 8px 0;
}
.chat-input textarea::placeholder { color: var(--text-faint); }
.chat-input-tools {
  display: flex;
  gap: 4px;
  padding-bottom: 4px;
}
.chat-tool {
  width: 32px;
  height: 32px;
  display: grid;
  place-items: center;
  border-radius: 9px;
  color: var(--text-muted);
}
.chat-tool:hover { background: var(--surface-2); color: var(--text); }
.send-btn {
  width: 34px;
  height: 34px;
  border-radius: 10px;
  background: var(--accent);
  color: var(--accent-fg);
  display: grid;
  place-items: center;
  transition: transform 0.15s ease;
}
.send-btn:hover { transform: scale(1.05); }
.send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

.chat-footer-note {
  font-size: 10.5px;
  color: var(--text-faint);
  text-align: center;
  margin-top: 8px;
  letter-spacing: 0.02em;
}

/* ============================================
   FEATURED SLIDER
   ============================================ */
.slider {
  position: relative;
  height: 420px;
  border-radius: var(--radius-lg);
  overflow: hidden;
  border: 1px solid var(--border);
  box-shadow: var(--shadow-card);
  isolation: isolate;
}

.slide {
  position: absolute;
  inset: 0;
  display: grid;
  grid-template-columns: 1fr 260px;
  gap: 32px;
  padding: 44px 48px;
  opacity: 0;
  pointer-events: none;
  transform: translateX(20px);
  transition: opacity 0.7s ease, transform 0.8s cubic-bezier(.22,.61,.36,1);
  color: #FBF6E8;
}
.slide.active {
  opacity: 1;
  pointer-events: auto;
  transform: translateX(0);
}

.slide-bg {
  position: absolute;
  inset: 0;
  z-index: -2;
}
.slide-bg::after {
  content: "";
  position: absolute;
  inset: 0;
  background:
    radial-gradient(circle at 80% 20%, rgba(255,255,255,0.12), transparent 50%),
    linear-gradient(180deg, transparent 40%, rgba(0,0,0,0.25));
  pointer-events: none;
}

.slide-pattern {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: -1;
  opacity: 0.7;
  pointer-events: none;
}

.slide-arabic-bg {
  position: absolute;
  top: -40px;
  right: 240px;
  font-family: var(--font-arabic);
  font-size: 360px;
  line-height: 1;
  font-weight: 700;
  color: rgba(255,255,255,0.07);
  user-select: none;
  pointer-events: none;
  z-index: 0;
}

.slide-content {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 10px;
  min-width: 0;
}

.slide-eyebrow {
  font-size: 11px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  font-weight: 600;
  color: rgba(255,255,255,0.7);
  margin-bottom: 4px;
}

.slide-title {
  font-family: var(--font-display);
  font-size: 48px;
  font-weight: 500;
  letter-spacing: -0.025em;
  line-height: 1.02;
  margin: 0;
  color: #FBF6E8;
}

.slide-arabic {
  font-family: var(--font-arabic);
  font-size: 28px;
  direction: rtl;
  color: rgba(255,255,255,0.85);
  margin-top: 2px;
}

.slide-author {
  font-size: 13.5px;
  color: rgba(255,255,255,0.75);
  margin-top: 2px;
  letter-spacing: -0.01em;
}

.slide-quote {

  font-size: 13px;
  font-weight: 600;
  letter-spacing: -0.005em;

}
.slide-cta.primary {
  background: #FBF6E8;
  color: #1A1A1A;
}
.slide-cta.primary:hover { transform: translateY(-1px); }
.slide-cta.ghost {
  background: rgba(255,255,255,0.1);
  color: #FBF6E8;
  border: 1px solid rgba(255,255,255,0.22);
  backdrop-filter: blur(6px);
}
.slide-cta.ghost:hover { background: rgba(255,255,255,0.18); }

.slide-cover {
  position: relative;
  z-index: 1;
  width: 220px;
  align-self: center;
  justify-self: end;
  filter: drop-shadow(0 24px 50px rgba(0,0,0,0.35));
  transform: rotate(3deg);
  transition: transform 0.5s ease;
}
.slide-cover svg {
  border-radius: 10px;
  overflow: hidden;
  aspect-ratio: 2 / 3;
  width: 100%;
}
.slide.active .slide-cover { transform: rotate(3deg) translateY(0); }
.slide:not(.active) .slide-cover { transform: rotate(3deg) translateY(20px); }

/* Arrows */
.slider-arrow {
  position: absolute;
  top: 50%;
  width: 38px;
  height: 38px;
  background: rgba(0,0,0,0.32);
  backdrop-filter: blur(8px);
  border: 1px solid rgba(255,255,255,0.18);
  border-radius: 50%;
  color: #FBF6E8;
  display: grid;
  place-items: center;
  z-index: 5;
  transform: translateY(-50%);
  transition: background 0.2s ease;
}
.slider-arrow:hover { background: rgba(0,0,0,0.5); }
.slider-arrow.prev { left: 18px; transform: translateY(-50%) rotate(90deg); }
.slider-arrow.next { right: 18px; transform: translateY(-50%) rotate(-90deg); }

/* Dots */
.slider-dots {
  position: absolute;
  bottom: 22px;
  left: 48px;
  display: flex;
  gap: 6px;
  z-index: 4;
}
.slider-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: rgba(255,255,255,0.35);
  transition: all 0.3s ease;
}
.slider-dot.active {
  background: #FBF6E8;
  width: 24px;
  border-radius: 4px;
}
.slider-dot:hover { background: rgba(255,255,255,0.6); }

.slider-count {
  position: absolute;
  bottom: 22px;
  right: 48px;
  font-family: var(--font-display);
  font-size: 13px;
  color: rgba(255,255,255,0.8);
  font-variant-numeric: tabular-nums;
  letter-spacing: 0.04em;
  z-index: 4;
}

@media (max-width: 1180px) {
  .slide { padding: 32px 36px; grid-template-columns: 1fr 200px; }
  .slide-title { font-size: 38px; }
  .slide-arabic-bg { right: 180px; font-size: 280px; }
  .slide-cover { width: 180px; }
  .slider { height: 380px; }
}
@media (max-width: 880px) {
  .slider { height: 360px; }

  .slide-title { font-size: 30px; }
  .slide-arabic-bg { right: 0; font-size: 220px; opacity: 0.04; }
  .slide-cover { display: none; }
  .slide-quote { display: none; }
  .slider-dots { left: 26px; bottom: 18px; }
  .slider-count { right: 26px; bottom: 18px; }

  .slider-arrow.next { right: 10px; }

.browse-hero h1 {
  font-family: var(--font-display);
  font-size: 38px;
  font-weight: 500;
  letter-spacing: -0.025em;

}
.browse-hero h1 em {
  font-style: italic;
  font-weight: 400;
  color: var(--accent);
}
.browse-hero p {
  font-size: 14px;
  color: var(--text-muted);
  line-height: 1.55;
  max-width: 580px;
  margin: 0;
}
.browse-hero-stats {
  display: flex;
  gap: 28px;
  margin-top: 20px;
}
.stat-num {
  font-family: var(--font-display);
  font-size: 22px;
  font-weight: 600;
  letter-spacing: -0.02em;

.stat-label {
  font-size: 11px;
  color: var(--text-muted);

}
.hero-pattern {
  position: absolute;
  right: -40px;
  top: -40px;
  width: 240px;
  height: 240px;

}

/* Section header */
.section-head {
  display: flex;
  align-items: end;
  justify-content: space-between;
  margin-bottom: 16px;
  gap: 16px;
}
.section-title {
  font-family: var(--font-display);
  font-size: 22px;
  font-weight: 500;
  letter-spacing: -0.02em;
  margin: 0;
}
.section-sub {
  font-size: 12.5px;
  color: var(--text-muted);
  margin-top: 4px;
}

.tabs {
  display: flex;
  gap: 4px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-pill);

}
.tab {
  height: 32px;
  padding: 0 14px;
  border-radius: var(--radius-pill);
  font-size: 12.5px;
  font-weight: 500;
  color: var(--text-muted);
  display: flex;
  align-items: center;
  gap: 6px;
  transition: all 0.2s ease;
}
.tab.active {
  background: var(--text);
  color: var(--bg);
}
body[data-aesthetic="dark"] .tab.active {
  background: var(--accent);
  color: var(--accent-fg);
}
.tab-count {
  font-size: 10.5px;
  opacity: 0.65;
}

/* Book grid */
.books-grid {
  display: grid;

  gap: 18px;
}

.book {
  display: flex;
  flex-direction: column;
  gap: 10px;
  cursor: pointer;
  transition: transform 0.25s ease;
}
.book:hover { transform: translateY(-3px); }
.book:hover .book-cover { box-shadow: var(--shadow-lift); }

.book-cover {
  aspect-ratio: 2 / 3;

  position: relative;
  box-shadow: var(--shadow-card);
  transition: box-shadow 0.25s ease;
}
.book-bookmark {
  position: absolute;
  top: 10px;
  right: 10px;
  width: 28px;
  height: 28px;

  background: rgba(255,255,255,0.85);
  backdrop-filter: blur(8px);
  display: grid;
  place-items: center;
  color: #14191E;
  z-index: 2;
  opacity: 0;
  transition: opacity 0.2s ease, transform 0.2s ease;
}
.book:hover .book-bookmark { opacity: 1; }
.book-bookmark.saved { opacity: 1; background: var(--accent); color: var(--accent-fg); }

.book-meta {

}
.book-title {

.book-author {
  font-size: 12px;

  -webkit-line-clamp: 1;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.book-tag {
  font-size: 10px;

  display: flex;
  align-items: center;
  gap: 6px;
}
.book-tag .dot {
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: var(--text-faint);
}

/* ============================================
   MOBILE — Floating pearl + fullscreen chat
   ============================================ */
.pearl {
  display: none;
  position: fixed;
  bottom: 24px;
  right: 24px;
  z-index: 80;
  width: 64px;
  height: 64px;
  border-radius: 50%;
  background: var(--text);
  color: var(--bg);
  box-shadow:
    0 12px 40px rgba(0,0,0,0.25),
    inset 0 1px 0 rgba(255,255,255,0.15);
  display: none;
  place-items: center;
  cursor: pointer;
  overflow: hidden;
  transition: transform 0.3s cubic-bezier(.34,1.56,.64,1), box-shadow 0.3s ease;
}
.pearl::before {
  content: "";
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at 30% 25%, rgba(255,255,255,0.35), transparent 50%);
  pointer-events: none;
}
body[data-aesthetic="dark"] .pearl { background: var(--accent); color: var(--accent-fg); }
.pearl:hover { transform: scale(1.05); }
.pearl-ping {
  position: absolute;
  inset: -4px;
  border-radius: 50%;
  border: 2px solid var(--accent);
  animation: ping 2.4s ease-out infinite;
  opacity: 0;
}
@keyframes ping {
  0% { transform: scale(0.9); opacity: 0.6; }
  100% { transform: scale(1.5); opacity: 0; }
}

.mobile-chat {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 100;
  background: var(--bg);
  flex-direction: column;
  animation: chatRise 0.45s cubic-bezier(.22,.61,.36,1);
}
@keyframes chatRise {
  from { transform: translateY(20px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}

@media (max-width: 1180px) {

  .lang-switch, .brand-sub { display: none; }
  .pearl { display: grid; }
  .pearl-show .mobile-chat { display: flex; }
}

  background: var(--accent-soft);
  color: var(--accent);
  display: inline-block;
  margin-bottom: 8px;
}

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    // Same-window signal so in-page listeners (deck-stage rail thumbnails)
    // can react — the parent message only reaches the host, not peers.
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-omelette-chrome=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">
          {children}
        </div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  // Segments wrap mid-word once per-segment width runs out. The track is
  // ~248px (280 panel − 28 body pad − 4 seg pad), each button loses 12px
  // to its own padding, and 11.5px system-ui averages ~6.3px/char — so 2
  // options fit ~16 chars each, 3 fit ~10. Past that (or >3 options), fall
  // back to a dropdown rather than wrap.
  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fitsAsSegments) {
    // <select> emits strings — map back to the original option value so the
    // fallback stays type-preserving (numbers, booleans) like the segment path.
    const resolve = (s) => {
      const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);
      return m === undefined ? s : typeof m === 'object' ? m.value : m;
    };
    return <TweakSelect label={label} value={value} options={options}
                        onChange={(s) => onChange(resolve(s))} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

// Relative-luminance contrast pick — checkmarks drawn over a swatch need to
// read on both #111 and #fafafa without per-option configuration. Hex input
// only (#rgb / #rrggbb); named or rgb()/hsl() colors fall through to "light".
function __twkIsLight(hex) {
  const h = String(hex).replace('#', '');
  const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
  const n = parseInt(x.slice(0, 6), 16);
  if (Number.isNaN(n)) return true;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return r * 299 + g * 587 + b * 114 > 148000;
}

const __TwkCheck = ({ light }) => (
  <svg viewBox="0 0 14 14" aria-hidden="true">
    <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2"
          strokeLinecap="round" strokeLinejoin="round"
          stroke={light ? 'rgba(0,0,0,.78)' : '#fff'} />
  </svg>
);

// TweakColor — curated color/palette picker. Each option is either a single
// hex string or an array of 1-5 hex strings; the card adapts — a lone color
// renders solid, a palette renders colors[0] as the hero (left ~2/3) with the
// rest stacked in a sharp column on the right. onChange emits the
// option in the shape it was passed (string stays string, array stays array).
// Without options it falls back to the native color input for back-compat.
function TweakColor({ label, value, options, onChange }) {
  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <input type="color" className="twk-swatch" value={value}
               onChange={(e) => onChange(e.target.value)} />
      </div>
    );
  }
  // Native <input type=color> emits lowercase hex per the HTML spec, so
  // compare case-insensitively. String() guards JSON.stringify(undefined),
  // which returns the primitive undefined (no .toLowerCase).
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero, ...rest] = colors;
          const sup = rest.slice(0, 4);
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" role="radio"
                    aria-checked={on} data-on={on ? '1' : '0'}
                    aria-label={colors.join(', ')} title={colors.join(' · ')}
                    style={{ background: hero }}
                    onClick={() => onChange(o)}>
              {sup.length > 0 && (
                <span>
                  {sup.map((c, j) => <i key={j} style={{ background: c }} />)}
                </span>
              )}
              {on && <__TwkCheck light={__twkIsLight(hero)} />}
            </button>
          );
        })}
      </div>
    </TweakRow>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});

})();

        {messages.map((msg, i) => {
          if (msg.role === "user") {
            return (
              <div key={i} className="msg user">
                <div className="msg-bubble">{msg.text}</div>
              </div>
            );
          }
          return (
            <div key={i} className="msg ai">
              <div className="msg-bubble">
                {msg.blocks.map((b, j) => (
                  <MessageBlock key={j} block={b} onOpenBook={onOpenBook} />
                ))}
              </div>
            </div>
          );
        })}

        {thinking && (
          <div className="msg ai">
            <div className="typing">
              <span></span>
              <span></span>
              <span></span>
            </div>
          </div>
        )}
      </div>

      {/* Input */}
      <div className="chat-input-wrap">
        <div className="chat-input">
          <textarea
            ref={inputRef}
            value={input}
            onChange={(e) => setInput(e.target.value)}
            onKeyDown={handleKey}
            placeholder={placeholders[lang]}
            rows={1}
          />
          <div className="chat-input-tools">
            <button className="chat-tool" title="Ekle" type="button">
              <Icon name="paperclip" size={16} />
            </button>
            <button className="chat-tool" title="Ses" type="button">
              <Icon name="mic" size={16} />
            </button>
            <button
              className="send-btn"
              onClick={handleSend}
              disabled={!input.trim()}
              type="button"
            >
              <Icon name="arrowUp" size={16} />
            </button>
          </div>
        </div>
        <div className="chat-footer-note">
          Hikme klasik kaynaklara dayanır — önemli konuları âlimlere danış.
        </div>
      </div>
    </div>
  );
};

window.ChatPanel = ChatPanel;

// ===== Mobile pearl =====
const Pearl = ({ onClick }) => (
  <button className="pearl" onClick={onClick} aria-label="AI sohbetini aç" type="button">
    <span className="pearl-ping"></span>
    <Icon name="sparkle" size={26} stroke={1.4} />
  </button>
);
window.Pearl = Pearl;

})();
</script>
<script type="text/babel" data-presets="react">
(function(){
/* eslint-disable */
// Islamic Library — main app: header, browse, filters, root
const { useState, useEffect, useMemo } = React;
const LIB = window.LIBRARY;
const { Icon, BookCover, ChatPanel, Pearl } = window;

// ===== Header =====
const Header = ({ lang, onLangChange }) => {

              <g stroke="currentColor" strokeWidth="4" strokeLinejoin="round" strokeLinecap="round" fill="none">

                <line x1="41" y1="46" x2="59" y2="46" />

            </svg>
          </div>
          <div className="brand-name">
            ISLAMIC<em>LIBRARY</em>
          </div>
        </div>

        <div className="search">
          <Icon name="search" size={16} />
          <input
            type="text"

            aria-label="Ara"
          />
          <div className="search-kbd">
            <kbd>⌘</kbd>
            <kbd>K</kbd>
          </div>
        </div>

        <div className="header-right">
          <div className="lang-switch" role="tablist">
            {["ru", "tr", "ar"].map((l) => (
              <button
                key={l}
                data-lang={l}
                className={lang === l ? "active" : ""}
                onClick={() => onLangChange(l)}
                type="button"
              >
                {l === "ar" ? "ع" : l.toUpperCase()}
              </button>
            ))}
          </div>
          <button className="icon-btn" title="Yer imleri" type="button">
            <Icon name="bookmark" size={16} />
          </button>
          <div className="avatar" title="Hesap">
            A
          </div>
        </div>
      </div>
    </header>
  );
};

// ===== Browse hero =====
const heroByAesthetic = {
  editorial: {
    eyebrow: "Islamic Library · 12 847 cilt",
    title: ["İslam düşüncesinin klasikleri —", "tek bir satırdan."],
    text:
      "Tefsir, hadis, fıkıh, felsefe. Sünni ve Şii kaynaklar tek bir katalogda. Hikme aradığını bulmana ve bağlamı açıklamana yardım eder.",
  },
  bookish: {
    eyebrow: "Islamic Library · فهرس",
    title: ["On dört yüzyıllık düşüncenin", "kitaplığı."],
    text:
      "el-Buhârî ve el-Küleynî'den modern tefsirlere. Aslından oku, çeviriden oku ya da Hikme'den açıklamasını iste.",
  },
  dark: {
    eyebrow: "Karanlık koleksiyon · seçkiler",
    title: ["Bin yıllık ilim —", "tek bir kandilin ışığında."],
    text:
      "Seçilmiş kütüphane: klasik metinler, tefsirler, biyografiler ve tasavvuf eserleri. Yapay zekâ asistanı ve hassas filtrelerle arama.",
  },
};

const HeroPattern = () => (
  <svg className="hero-pattern" viewBox="0 0 200 200" fill="none">
    <g stroke="var(--accent)" strokeWidth="0.8" opacity="0.7">
      {[...Array(8)].map((_, i) => {
        const a = (i * Math.PI) / 4;
        return (
          <line
            key={i}
            x1={100}
            y1={100}
            x2={100 + Math.cos(a) * 90}
            y2={100 + Math.sin(a) * 90}
          />
        );
      })}
      <circle cx="100" cy="100" r="30" />
      <circle cx="100" cy="100" r="55" />
      <circle cx="100" cy="100" r="85" />
      {/* 8-pointed star */}
      <g>
        <rect x="60" y="60" width="80" height="80" transform="rotate(0 100 100)" />
        <rect x="60" y="60" width="80" height="80" transform="rotate(45 100 100)" />
      </g>
    </g>
  </svg>
);

const Hero = ({ aesthetic }) => {
  const h = heroByAesthetic[aesthetic] || heroByAesthetic.editorial;
  return (
    <div className="browse-hero">
      <HeroPattern />
      <div className="browse-hero-eyebrow">{h.eyebrow}</div>
      <h1>
        {h.title[0]} <br />
        <em>{h.title[1]}</em>
      </h1>
      <p>{h.text}</p>
      <div className="browse-hero-stats">
        <div>
          <span className="stat-num">12 847</span>
          <div className="stat-label">Cilt</div>
        </div>
        <div>
          <span className="stat-num">3 ٫ 1 M</span>
          <div className="stat-label">Dizindeki ayet ve hadis</div>
        </div>
        <div>
          <span className="stat-num">9</span>
          <div className="stat-label">Kategori</div>
        </div>
      </div>
    </div>
  );
};

// ===== Featured slider =====
const FeaturedSlider = ({ onAsk }) => {
  const featured = LIB.books.filter((b) => b.featured);
  const [idx, setIdx] = useState(0);
  const [paused, setPaused] = useState(false);

  useEffect(() => {
    if (paused) return;
    const t = setInterval(() => setIdx((i) => (i + 1) % featured.length), 7000);
    return () => clearInterval(t);
  }, [paused, featured.length]);

  const go = (n) => setIdx((n + featured.length) % featured.length);
  const current = featured[idx];
  const [c1, c2] = LIB.covers[current.cover];

  return (
    <div
      className="slider"
      onMouseEnter={() => setPaused(true)}
      onMouseLeave={() => setPaused(false)}
    >
      {featured.map((b, i) => {
        const [bc1, bc2] = LIB.covers[b.cover];
        return (
          <div
            key={b.id}
            className={`slide ${i === idx ? "active" : ""}`}
            aria-hidden={i !== idx}
          >
            <div
              className="slide-bg"
              style={{
                background: `linear-gradient(135deg, ${bc1}, ${bc2})`,
              }}
            />
            <svg
              className="slide-pattern"
              viewBox="0 0 400 400"
              preserveAspectRatio="none"
              aria-hidden="true"
            >
              <defs>
                <pattern
                  id={`sp-${b.id}`}
                  width="60"
                  height="60"
                  patternUnits="userSpaceOnUse"
                  patternTransform="rotate(45)"
                >
                  <path
                    d="M0 30 L30 0 L60 30 L30 60 Z"
                    fill="none"
                    stroke="rgba(255,255,255,0.06)"
                    strokeWidth="1"
                  />
                </pattern>
              </defs>
              <rect width="400" height="400" fill={`url(#sp-${b.id})`} />
            </svg>
            <div className="slide-arabic-bg" aria-hidden="true">
              {b.mark}
            </div>

            <div className="slide-content">
              <div className="slide-eyebrow">Seçkiler · Klasikler</div>
              <h2 className="slide-title">{b.title}</h2>
              <div className="slide-arabic">{b.titleAr}</div>
              <div className="slide-author">{b.author.split(" · ")[0]}</div>
              {b.quote && (
                <div className="slide-quote">
                  {b.quoteAr && (
                    <span className="slide-quote-ar">{b.quoteAr}</span>
                  )}
                  <span className="slide-quote-ru">«{b.quote}»</span>
                </div>
              )}
              <div className="slide-ctas">
                <button className="slide-cta primary" type="button">
                  <Icon name="book" size={15} />
                  Oku
                </button>
                <button
                  className="slide-cta ghost"
                  type="button"
                  onClick={() => onAsk && onAsk(b)}
                >
                  <Icon name="sparkle" size={15} />
                  Kitabı Hikme'ye sor
                </button>
              </div>
            </div>

            <div className="slide-cover">
              <BookCover book={b} large />
            </div>
          </div>
        );
      })}

      <button
        className="slider-arrow prev"
        onClick={() => go(idx - 1)}
        aria-label="Önceki"
        type="button"
      >
        <Icon name="chevronDown" size={18} />
      </button>
      <button
        className="slider-arrow next"
        onClick={() => go(idx + 1)}
        aria-label="Sonraki"
        type="button"
      >
        <Icon name="chevronDown" size={18} />
      </button>

      <div className="slider-dots">
        {featured.map((b, i) => (
          <button
            key={b.id}
            className={`slider-dot ${i === idx ? "active" : ""}`}
            onClick={() => setIdx(i)}
            aria-label={`Slide ${i + 1}`}
            type="button"
          />
        ))}
      </div>

      <div className="slider-count">
        {String(idx + 1).padStart(2, "0")} / {String(featured.length).padStart(2, "0")}
      </div>
    </div>
  );
};

// ===== Tabs (categories) =====
const Tabs = ({ value, onChange }) => {
  // Show first 5 categories as tabs
  const visible = LIB.categories.slice(0, 5);
  return (
    <div className="tabs">
      {visible.map((c) => (
        <button
          key={c.id}
          className={`tab ${value === c.id ? "active" : ""}`}
          onClick={() => onChange(c.id)}
          type="button"
        >
          {c.label}
          <span className="tab-count">{c.count.toLocaleString("tr")}</span>
        </button>
      ))}
    </div>
  );
};

// ===== Book card =====
const BookCard = ({ book }) => {
  const [saved, setSaved] = useState(false);
  const cat = LIB.categories.find((c) => c.id === book.category);
  return (
    <div className="book">
      <div className="book-cover">
        <button
          className={`book-bookmark ${saved ? "saved" : ""}`}
          onClick={(e) => {
            e.stopPropagation();
            setSaved((s) => !s);
          }}
          type="button"
          aria-label="Yer imi"
        >
          <Icon name="bookmark" size={14} stroke={2} />
        </button>
        <BookCover book={book} />
      </div>
      <div className="book-meta">
        <h3 className="book-title">{book.title}</h3>
        <div className="book-author">{book.author.split(" · ")[0]}</div>
        <div className="book-tag">
          {cat ? cat.label : ""}
          <span className="dot"></span>
          {book.pages.toLocaleString("tr")} s.
        </div>
      </div>
    </div>
  );
};

// ===== Filters panel =====
const Filters = ({ category, onCategory }) => {
  return (
    <aside className="filters">
      <div className="filter-head">
        <h3>Filtreler</h3>
        <button className="filter-clear" type="button">
          Sıfırla
        </button>
      </div>

      <div className="filter-group">
        <div className="filter-label">Sıralama</div>
        <div className="filter-pill-row">
          <span className="filter-pill active">İlgi düzeyine göre</span>
          <span className="filter-pill">Yeniler</span>
          <span className="filter-pill">A — Z</span>
          <span className="filter-pill">Popüler</span>
        </div>
      </div>

      <div className="filter-group">
        <div className="filter-label">Kategori</div>
        {LIB.categories.map((c) => (
          <div
            key={c.id}
            className={`filter-cat ${category === c.id ? "active" : ""}`}
            onClick={() => onCategory(c.id)}
          >
            <span>{c.label}</span>
            <span className="filter-cat-count">{c.count.toLocaleString("tr")}</span>
          </div>
        ))}
      </div>

      <div className="filter-group">
        <div className="filter-label">Yazıldığı yüzyıl</div>
        <input
          type="range"
          min="7"
          max="21"
          defaultValue="15"
          className="filter-slider"
        />
        <div className="filter-range-row">
          <span>VII. yy</span>
          <span>XXI. yy</span>
        </div>
      </div>

      <div className="filter-group">
        <div className="filter-label">Orijinal dil</div>
        <div className="filter-pill-row">
          <span className="filter-pill active">Arapça</span>
          <span className="filter-pill">Farsça</span>
          <span className="filter-pill">Türkçe</span>
          <span className="filter-pill">Urduca</span>
        </div>
      </div>

      <div className="filter-group">
        <div className="filter-label">Erişilebilirlik</div>
        <div className="filter-pill-row">
          <span className="filter-pill">PDF</span>
          <span className="filter-pill">Sesli</span>
          <span className="filter-pill active">TR Çeviri</span>
        </div>
      </div>
    </aside>
  );
};

// ===== Tweaks panel =====
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "aesthetic": "editorial",
  "lang": "tr"
}/*EDITMODE-END*/;

const App = () => {
  const [tweaks, setTweak] = window.useTweaks(TWEAK_DEFAULTS);
  const [category, setCategory] = useState("all");
  const [mobileOpen, setMobileOpen] = useState(false);

  const aesthetic = tweaks.aesthetic;
  const lang = tweaks.lang;

  // Apply aesthetic to body
  useEffect(() => {
    document.body.setAttribute("data-aesthetic", aesthetic);
  }, [aesthetic]);

  const filtered = useMemo(() => {
    return LIB.books.filter(
      (b) => category === "all" || b.category === category
    );
  }, [category]);

  const browseSubtitle = `koleksiyondan ${filtered.length} kitap`;

  return (
    <>
      <Header lang={lang} onLangChange={(l) => setTweak("lang", l)} />

      <div className="layout">
        {/* Left — Chat */}
        <div className="col-chat" data-screen-label="ai-chat">
          <ChatPanel
            lang={lang}
            onLangChange={(l) => setTweak("lang", l)}
            isMobile={false}
          />
        </div>

        {/* Center — Browse */}
        <main className="browse" data-screen-label="browse">
          <FeaturedSlider />

          <div>
            <div className="section-head">
              <div>
                <h2 className="section-title">Katalog</h2>
                <div className="section-sub">{browseSubtitle}</div>
              </div>
              <Tabs value={category} onChange={setCategory} />
            </div>
            <div className="books-grid">
              {filtered.map((b) => (
                <BookCard key={b.id} book={b} />
              ))}
            </div>
          </div>
        </main>

        {/* Right — Filters */}
        <div className="col-filters" data-screen-label="filters">
          <Filters
            category={category}
            onCategory={setCategory}
          />
        </div>
      </div>

      {/* Mobile pearl */}
      <Pearl onClick={() => setMobileOpen(true)} />
      {mobileOpen && (
        <div
          className="mobile-chat"
          style={{ display: "flex" }}
          data-screen-label="mobile-chat"
        >
          <ChatPanel
            lang={lang}
            onLangChange={(l) => setTweak("lang", l)}
            isMobile={true}
            onClose={() => setMobileOpen(false)}
          />
        </div>
      )}

      {/* Tweaks */}
      <window.TweaksPanel title="Tweaks">
        <window.TweakSection label="Estetik" />
        <window.TweakRadio
          label="Tema"
          value={tweaks.aesthetic}
          onChange={(v) => setTweak("aesthetic", v)}
          options={[
            { value: "editorial", label: "Editorial" },
            { value: "bookish", label: "Bookish" },
            { value: "dark", label: "Dark" },
          ]}
        />
        <window.TweakSection label="Arayüz dili" />
        <window.TweakRadio
          label="Dil"
          value={tweaks.lang}
          onChange={(v) => setTweak("lang", v)}
          options={[
            { value: "ru", label: "RU" },
            { value: "tr", label: "TR" },
            { value: "ar", label: "AR" },
          ]}
        />
      </window.TweaksPanel>
    </>
  );
};

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);

})();
</script>
</body>
